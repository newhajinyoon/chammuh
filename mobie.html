<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <!-- 노치/세이프 영역, 모바일 100vh 문제 보정 -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>chammuh barber</title>
  <link href='//spoqa.github.io/spoqa-han-sans/css/SpoqaHanSans-kr.css' rel='stylesheet' type='text/css'>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/3.7.2/animate.min.css" rel="stylesheet" type="text/css">
  <style>
    /* 기본 리셋 */
    * { padding:0; margin:0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html,body { height:100%; background:#000; }

    /* --vh 변수는 JS에서 설정 (모바일 주소창 문제 보정) */
    :root { --vh: 1vh; }

    /* 최상위 컨테이너: 화면 전체를 덮고 중앙 정렬 */
    .container {
      position: fixed;
      inset: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: calc(var(--vh, 1vh) * 100);
      background: black;
      overflow: hidden;
    }

    /* 캔버스: 원본 논리 비율(16:9, 960x540)을 유지하면서 중앙에 */
    canvas {
      border-radius: 0.5rem;
      display: block;
      width: min(960px, 100%);
      height: auto;
      max-height: 100%;
      background: #0044ff9a;
      touch-action: manipulation;
      user-select: none;
    }

    /* 가로 전체화면 모드 (정식 Fullscreen + orientation lock 성공 시) */
    .landscape-fullscreen {
      width: 100vw !important;
      height: 100vh !important;
    }
    .landscape-fullscreen canvas {
      width: 100vw !important;
      height: 100vh !important;
      max-width: none;
      max-height: none;
      border-radius: 0;
      object-fit: cover;
    }

    /* Fallback: 화면 회전(CSS transform) 적용 모드 (orientation.lock 실패시 사용) */
    .rotated-css {
      /* 컨테이너를 가로로 회전시키고 가운데 정렬 */
      transform: rotate(90deg);
      transform-origin: center center;
      width: 100vh !important;  /* swapped dims */
      height: 100vw !important;
      position: fixed;
      top: 50%;
      left: 50%;
      margin: 0;
      padding: 0;
      /* translate로 화면 중앙 정렬 */
      translate: -50% -50%;
    }
    .rotated-css canvas {
      width: 100% !important;
      height: 100% !important;
      max-width: none;
      max-height: none;
      border-radius: 0;
    }

    /* 가로요청 버튼 (작고 눈에 거슬리지 않게) */
    .rotate-btn {
      position: fixed;
      right: 12px;
      bottom: 12px;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(255,255,255,0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(4px);
      z-index: 9999;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.06);
    }
    .rotate-btn svg { width: 24px; height:24px; fill: white; opacity: 0.9; }

    /* 상태를 간단히 보여주는 작은 dot (선택적) */
    .rotate-btn.active { background: rgba(255,255,255,0.16); }

    /* 접근성: 숨김 텍스트(스크린리더 제외) */
    .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
  </style>
</head>
<body>
  <!-- 텍스트는 모두 제거될 예정(원하면 JS에서 완전 삭제) -->
  <div class="container">
    <canvas id="game" width="960" height="540"></canvas>
  </div>

  <!-- 가로 요청 버튼: 누르면 전체화면+가로 고정 시도, 실패 시 CSS 회전으로 대체 -->
  <button class="rotate-btn" id="rotateBtn" aria-label="가로 전체화면 요청">
    <!-- 간단한 회전 아이콘 -->
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M12 2v4l3-3-3-1zm7 7h4v-2h-4V9a7 7 0 1 0 1 13h2a9 9 0 1 1-9-9v2l3-3-3-3v4z"></path>
    </svg>
    <span class="sr-only">가로 전체화면</span>
  </button>

  <!-- 기존 스크립트 로드(순서 유지) -->
  <audio id="bgm-player" loop></audio>
  <audio id="sfx-player"></audio>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@9"></script>
  <script src="./Visual-Novel-Engine/mobile.js"></script>
  <script src="index.js"></script>

  <!-- 보조 스크립트: 텍스트 제거, --vh 세팅, 터치→마우스 합성, 가로 전체화면 요청/페일백 -->
<script>
(function(){
  const CANVAS_W = 960, CANVAS_H = 540;
  const canvas = document.getElementById('game');
  const container = document.querySelector('.container');
  const rotateBtn = document.getElementById('rotateBtn');

  if (!canvas || !container) return;

  // 텍스트 제거 (요청)
  document.querySelectorAll('h1,h2,h3,p,footer,.title,.footer').forEach(el=>el.remove());

  // --vh 변수 보정 (모바일 주소창 이슈)
  function setVhVar(){ document.documentElement.style.setProperty('--vh', (window.innerHeight * 0.01) + 'px'); }
  setVhVar();
  window.addEventListener('resize', setVhVar);
  window.addEventListener('orientationchange', ()=> setTimeout(setVhVar, 200));

  // 터치 -> 마우스 이벤트 합성 (기존 엔진 유지)
  function dispatchMouseEvent(type, touchEvent){
    const touches = (touchEvent.changedTouches && touchEvent.changedTouches.length) ? touchEvent.changedTouches : touchEvent.touches;
    if (!touches || touches.length === 0) return;
    const t = touches[0];
    const evt = new MouseEvent(type, { bubbles:true, cancelable:true, clientX: t.clientX, clientY: t.clientY, view: window });
    canvas.dispatchEvent(evt);
  }
  canvas.addEventListener('touchstart', e=>{ e.preventDefault(); dispatchMouseEvent('mousemove', e); dispatchMouseEvent('click', e); }, {passive:false});
  canvas.addEventListener('touchmove',  e=>{ e.preventDefault(); dispatchMouseEvent('mousemove', e); }, {passive:false});
  canvas.addEventListener('touchend',   e=>{ e.preventDefault(); canvas.dispatchEvent(new MouseEvent('mouseup',{bubbles:true})); }, {passive:false});
  canvas.addEventListener('contextmenu', e=>e.preventDefault());

  // 캔버스 회전용 클래스 (회전시 transform 적용)
  const ROTATED_CLASS = 'rotated-canvas';
  const STYLE_ID = 'nv-fit-canvas-style';
  if (!document.getElementById(STYLE_ID)){
    const s = document.createElement('style');
    s.id = STYLE_ID;
    s.textContent = `
      canvas.${ROTATED_CLASS} {
        transform: rotate(90deg);
        transform-origin: center center;
        will-change: transform;
      }
      /* fullscreen class on body: still preserve aspect via JS fit */
      body.landscape-fullscreen { overflow: hidden; }
    `;
    document.head.appendChild(s);
  }

  // 뷰포트 크기(안전영역 포함) 읽기
  function getViewportDims(){
    // innerWidth/innerHeight already reflect safe area and address bar in most mobile browsers
    return { vw: window.innerWidth, vh: window.innerHeight };
  }

  // 캔버스 크기 맞추기 (rotated=false: 정상, rotated=true: 캔버스가 90deg 회전된 상태로 보게 됨)
  function fitCanvas(rotated = false) {
    const { vw, vh } = getViewportDims();

    // 스케일 계산:
    // - 정상: s <= min(vw / CANVAS_W, vh / CANVAS_H)
    // - 회전:  캔버스가 90도 회전되면 화면에 보이는 폭 = s * CANVAS_H, 높이 = s * CANVAS_W
    //          따라서 s <= min(vw / CANVAS_H, vh / CANVAS_W)
    let s;
    if (!rotated) {
      s = Math.min(vw / CANVAS_W, vh / CANVAS_H);
    } else {
      s = Math.min(vw / CANVAS_H, vh / CANVAS_W);
    }
    // 안전값
    if (!isFinite(s) || s <= 0) s = 1;

    // 정수 픽셀로 설정(브라우저 렌더링 이슈 최소화)
    const newW = Math.round(CANVAS_W * s);
    const newH = Math.round(CANVAS_H * s);

    // 캔버스 스타일만 변경 — 내부 논리 해상도(속성 width/height)는 건드리지 않음
    canvas.style.width = newW + 'px';
    canvas.style.height = newH + 'px';

    // 회전 클래스 토글
    if (rotated) canvas.classList.add(ROTATED_CLASS);
    else canvas.classList.remove(ROTATED_CLASS);

    // container 중앙 정렬 보장(플렉스 박스 이용)
    container.style.display = 'flex';
    container.style.alignItems = 'center';
    container.style.justifyContent = 'center';
  }

  // 초기 맞춤
  fitCanvas(false);

  // 리사이즈/회전/풀스크린 변화에 반응
  window.addEventListener('resize', ()=> fitCanvas(canvas.classList.contains(ROTATED_CLASS)));
  window.addEventListener('orientationchange', ()=> setTimeout(()=> fitCanvas(canvas.classList.contains(ROTATED_CLASS)), 200));
  document.addEventListener('fullscreenchange', ()=> fitCanvas(canvas.classList.contains(ROTATED_CLASS)));

  // 전체화면 + screen.orientation.lock 시도 함수
  async function requestLandscapeFullscreen(){
    const target = document.documentElement;
    try {
      if (target.requestFullscreen) await target.requestFullscreen();
      else if (target.webkitRequestFullscreen) await target.webkitRequestFullscreen();
      else if (target.msRequestFullscreen) await target.msRequestFullscreen();

      // orientation lock (대부분 fullscreen 상태에서만 동작)
      if (screen.orientation && screen.orientation.lock) {
        await screen.orientation.lock('landscape');
      } else if (screen.lockOrientation) {
        try { screen.lockOrientation('landscape'); } catch(e){}
      }

      // 성공(또는 허용된 상태)으로 간주 — 화면 비율 유지하여 맞춤
      document.body.classList.add('landscape-fullscreen');
      // 풀스크린으로 바뀔 때 뷰포트가 바뀌므로 fitCanvas 호출
      setTimeout(()=> fitCanvas(false), 200);
      return true;
    } catch (err) {
      console.warn('Fullscreen/orientation lock 실패:', err);
      // 폴백: CSS 회전 적용 (캔버스만 90도 회전)
      applyCssRotationFallback();
      return false;
    }
  }

  function exitLandscapeFullscreen(){
    try {
      if (document.exitFullscreen) document.exitFullscreen();
      else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      else if (document.msExitFullscreen) document.msExitFullscreen();
    } catch(e){}
    document.body.classList.remove('landscape-fullscreen');
    canvas.classList.remove(ROTATED_CLASS);
    fitCanvas(false);
  }

  function applyCssRotationFallback(){
    // canvas 자체를 90deg 회전시키고, 회전된 상태에 맞춰 사이즈 재조정
    // (rotated=true 이면 fitCanvas는 회전 관련 계산식을 사용)
    fitCanvas(true);
    rotateBtn.classList.add('active');
  }

  // 버튼 토글 처리
  let inLandscape = false;
  rotateBtn.addEventListener('click', async (e)=>{
    e.stopPropagation();
    if (!inLandscape) {
      const ok = await requestLandscapeFullscreen();
      inLandscape = true;
      rotateBtn.classList.toggle('active', ok);
    } else {
      exitLandscapeFullscreen();
      inLandscape = false;
      rotateBtn.classList.remove('active');
    }
  });

  // 만약 사용자가 브라우저 뒤로/풀스크린 수동 해제 등으로 상태변화가 있으면 동기화
  document.addEventListener('fullscreenchange', ()=>{
    const fs = !!(document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement);
    if (!fs) {
      document.body.classList.remove('landscape-fullscreen');
      rotateBtn.classList.remove('active');
      inLandscape = false;
      // 회전 잠금 해제 시 리사이즈 적용
      fitCanvas(false);
      try { if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); } catch(e){}
    }
  });

  // 첫 상호작용에서 BGM 재생 시도 (자동재생 정책 완화)
  function tryUnlockAudio(){ const bgm = document.getElementById('bgm-player'); if(bgm) bgm.play().catch(()=>{}); window.removeEventListener('touchstart', tryUnlockAudio); window.removeEventListener('click', tryUnlockAudio); }
  window.addEventListener('touchstart', tryUnlockAudio, {passive:true});
  window.addEventListener('click', tryUnlockAudio, {passive:true});

  // 초기 재적용(짧은 지연으로 레이아웃 안정화 확보)
  setTimeout(()=> fitCanvas(false), 100);

})();
</script>

</body>
</html>
